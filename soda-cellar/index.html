<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soda Cellar</title>
<meta name="description" content="A running tally of root beers, ginger beers, birch beers and sarsaparillas tasted, rated, and reviewed.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#F6F1E2; --surface:#FFFFFF; --surface-2:#EEE4CB; --line:#E1D3B4;
    --ink:#2B1B10; --muted:#8A7360; --accent:#9C4A16; --accent-ink:#FFFFFF;
    --accent-2:#4F6B4A; --good:#3E7A45; --bad:#B23A3A; --chip-bg:#EEE4CB;
    --shadow: 0 1px 2px rgba(43,27,16,.06), 0 6px 16px rgba(43,27,16,.06);
    --t-amaze:#167A4A;     --t-amaze-bg:rgba(22,122,74,.14);
    --t-verygood:#2E9C52;  --t-verygood-bg:rgba(46,156,82,.14);
    --t-good:#6FA829;      --t-good-bg:rgba(111,168,41,.16);
    --t-medium:#C98A00;    --t-medium-bg:rgba(201,138,0,.14);
    --t-lowmedium:#D9660A; --t-lowmedium-bg:rgba(217,102,10,.15);
    --t-ok:#D1421C;        --t-ok-bg:rgba(209,66,28,.15);
    --t-bad:#C11F32;       --t-bad-bg:rgba(193,31,50,.14);
    --accent-2-bg:rgba(79,107,74,.12);
    --ax-sweet:#AF1761; --ax-spice:#BF4415; --ax-carb:#155FA0; --ax-body:#7A5230; --ax-flavor:#6A3D9A;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#211510; --surface:#2C1D15; --surface-2:#3A271B; --line:#4A3626;
      --ink:#F2E7D8; --muted:#C7AC90; --accent:#E58F49; --accent-ink:#211008;
      --accent-2:#8FB587; --good:#7FBF83; --bad:#E1817E; --chip-bg:#3A271B;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
      --t-amaze:#34E28C;     --t-amaze-bg:rgba(52,226,140,.20);
      --t-verygood:#4FE07A;  --t-verygood-bg:rgba(79,224,122,.20);
      --t-good:#A8E23E;      --t-good-bg:rgba(168,226,62,.20);
      --t-medium:#FFCB3D;    --t-medium-bg:rgba(255,203,61,.20);
      --t-lowmedium:#FF9A4D; --t-lowmedium-bg:rgba(255,154,77,.20);
      --t-ok:#FF6F4A;        --t-ok-bg:rgba(255,111,74,.20);
      --t-bad:#FF4D5E;       --t-bad-bg:rgba(255,77,94,.20);
      --accent-2-bg:rgba(143,181,135,.16);
      --ax-sweet:#FF5FA8; --ax-spice:#FF7A45; --ax-carb:#4FB4F0; --ax-body:#D9A066; --ax-flavor:#B58AE0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#211510; --surface:#2C1D15; --surface-2:#3A271B; --line:#4A3626;
    --ink:#F2E7D8; --muted:#C7AC90; --accent:#E58F49; --accent-ink:#211008;
    --accent-2:#8FB587; --good:#7FBF83; --bad:#E1817E; --chip-bg:#3A271B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    --t-amaze:#34E28C;     --t-amaze-bg:rgba(52,226,140,.20);
    --t-verygood:#4FE07A;  --t-verygood-bg:rgba(79,224,122,.20);
    --t-good:#A8E23E;      --t-good-bg:rgba(168,226,62,.20);
    --t-medium:#FFCB3D;    --t-medium-bg:rgba(255,203,61,.20);
    --t-lowmedium:#FF9A4D; --t-lowmedium-bg:rgba(255,154,77,.20);
    --t-ok:#FF6F4A;        --t-ok-bg:rgba(255,111,74,.20);
    --t-bad:#FF4D5E;       --t-bad-bg:rgba(255,77,94,.20);
    --accent-2-bg:rgba(143,181,135,.16);
    --ax-sweet:#FF5FA8; --ax-spice:#FF7A45; --ax-carb:#4FB4F0; --ax-body:#D9A066; --ax-flavor:#B58AE0;
  }
  *{ box-sizing:border-box; }
  html,body{ background:var(--bg); }
  body{
    margin:0; color:var(--ink);
    font-family:"Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-inline:16px;
  }
  h1,h2,h3{ font-family:"Fraunces", Georgia, "Times New Roman", serif; text-wrap:balance; margin:0; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric:tabular-nums; }
  a{ color:inherit; }
  button{ font:inherit; }

  .wrap{ max-width:1080px; margin:0 auto; padding-block:20px 48px; }

  header.top{
    position:sticky; top:0;
    background:var(--bg); z-index:5; padding-block:14px 12px;
    border-bottom:1px solid var(--line); margin-bottom:16px;
  }
  .title-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .title-row h1{ font-size:28px; font-weight:600; letter-spacing:-0.01em; }
  .subtitle{ color:var(--muted); font-size:13px; margin-top:2px; }
  .top-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13.5px; font-weight:500;
    transition:transform .08s ease, border-color .15s ease; text-decoration:none;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:14px; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button{
    border:none; background:var(--surface); color:var(--muted); padding:7px 12px; font-size:13px; cursor:pointer;
    border-right:1px solid var(--line);
  }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--accent); color:var(--accent-ink); font-weight:600; }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    border:1px solid var(--line); background:var(--chip-bg); color:var(--ink);
    padding:5px 11px; border-radius:99px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }

  .search{
    flex:1 1 180px; min-width:140px; max-width:260px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:7px 11px; border-radius:8px; font-size:13px;
  }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:16px; }
  .group-heading{ display:flex; align-items:baseline; gap:8px; margin:26px 0 4px; grid-column:1/-1; }
  .group-heading h2{ font-size:18px; }
  .group-heading .count{ color:var(--muted); font-size:12.5px; }
  .grid > .group-heading:first-child{ margin-top:6px; }

  .group-frame{
    grid-column:1/-1; display:flex; flex-direction:column; gap:2px;
    border:1.5px dashed var(--line); border-radius:14px;
    padding:16px 16px 18px; margin:16px 0 4px;
  }
  .grid > .group-frame:first-child{ margin-top:6px; }
  .group-frame > .group-heading{ margin:0 0 8px; cursor:pointer; user-select:none; }
  .group-frame > .group-heading:hover h2{ color:var(--accent); }
  .group-frame.collapsed{ padding-bottom:16px; }
  .group-frame.collapsed > .group-heading{ margin-bottom:0; }
  .group-heading .chevron{
    display:inline-block; font-size:11px; color:var(--muted); transition:transform .12s ease; flex:none;
  }
  .group-frame.collapsed .chevron{ transform:rotate(-90deg); }

  .group-body{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;
  }
  .group-frame.collapsed .group-body{ display:none; }

  .tier-band{
    grid-column:1/-1; display:flex; align-items:center; gap:8px;
    margin:18px 0 2px; padding:7px 14px; border-radius:8px;
    border-left:4px solid transparent;
  }
  .grid > .group-heading + .tier-band, .grid > .tier-band:first-of-type{ margin-top:8px; }
  .group-body > .tier-band:first-child{ margin-top:0; }
  .tier-band .tier-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .tier-band .tier-band-label{ font-family:"Fraunces",serif; font-weight:600; font-size:14.5px; letter-spacing:.01em; }
  .tier-band .count{ color:var(--muted); font-size:12px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
    border-left:3px solid transparent;
  }
  .card-top{ display:flex; gap:10px; }
  .photo{
    width:56px; height:56px; border-radius:10px; flex:none; overflow:hidden;
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-family:"Fraunces",serif; font-weight:600; font-size:20px;
    border:1px solid var(--line);
  }
  .photo img{ width:100%; height:100%; object-fit:cover; }
  .photo.clickable{ cursor:zoom-in; }

  .lightbox-back{
    position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center;
    justify-content:center; padding:24px 16px; z-index:30; cursor:zoom-out;
  }
  .lightbox{ max-width:min(90vw,480px); text-align:center; }
  .lightbox img{ max-width:100%; max-height:70vh; border-radius:12px; box-shadow:var(--shadow); background:var(--surface); }
  .lightbox .cap{ color:#fff; margin-top:12px; font-size:14px; }
  .lightbox .cap .manu{ text-transform:uppercase; letter-spacing:.04em; font-size:11.5px; opacity:.75; }
  .lightbox .cap .name{ font-family:"Fraunces",serif; font-size:18px; font-weight:600; margin-top:2px; }
  .id-block{ min-width:0; }
  .id-block .manu{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .id-block .name{ font-size:15px; font-weight:600; line-height:1.25; }

  .badges{ display:flex; flex-wrap:wrap; gap:5px; }
  .badge{
    font-size:11px; padding:3px 8px; border-radius:99px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-weight:600; white-space:nowrap;
  }
  .badge.tier{ border-color:transparent; }
  .badge.unique{ background:transparent; border:1px dashed var(--accent-2); color:var(--accent-2); }
  .badge.inv{ background:transparent; border:1px solid var(--muted); color:var(--muted); }
  .badge.want{ background:transparent; border:1px dashed var(--accent); color:var(--accent); }

  .notes{ font-size:13px; color:var(--ink); line-height:1.4; }

  .description{ font-size:12.5px; color:var(--muted); line-height:1.4; font-style:italic; }

  .axis-row{ display:flex; flex-wrap:wrap; gap:5px 12px; }
  .axis-chip{ display:inline-flex; align-items:baseline; gap:4px; font-weight:600; }
  .axis-chip .axis-abbr{ font-size:11px; letter-spacing:.03em; opacity:.9; }
  .axis-chip .axis-num{ font-size:12.5px; }
  .axis-chip .axis-dots{ font-size:9px; letter-spacing:1.5px; opacity:.85; }

  .empty-state{
    grid-column:1/-1; text-align:center; padding:40px 20px; color:var(--muted);
    border:1px dashed var(--line); border-radius:12px;
  }

  footer.pagefoot{ text-align:center; color:var(--muted); font-size:12.5px; padding-block:24px 8px; }

  @media (max-width:480px){
    .title-row h1{ font-size:23px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="title-row">
      <div>
        <h1>Soda Cellar</h1>
        <div class="subtitle">Root beers, ginger beers, birch beer &amp; friends — tasted and rated by Parag.</div>
      </div>
      <div class="top-actions">
        <button class="btn" id="exportTextBtn">Export as text</button>
        <button class="btn" id="exportHtmlBtn">Export as HTML</button>
        <button class="btn primary" id="exportViewBtn">Export view (Excel)</button>
      </div>
    </div>
    <div class="controls">
      <div class="seg" id="statusSeg">
        <button data-v="tried" class="active">Tried</button>
        <button data-v="inventory">Inventory</button>
        <button data-v="want_to_try">Want to try</button>
      </div>
      <div class="seg" id="sortSeg">
        <button data-v="type" class="active">Group by type</button>
        <button data-v="rating">Sort by rating</button>
      </div>
      <div class="chips" id="catChips"></div>
      <input class="search" id="searchBox" type="text" placeholder="Search manufacturer, name, notes…">
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer class="pagefoot">Snapshot exported from a live tracker — ratings and notes as of the export date shown in the exports.</footer>
</div>

<script src="vendor/xlsx.core.min.js"></script>
<script>
(function(){
  "use strict";

  var CATEGORIES = [
    {v:"root_beer", label:"Root Beer"},
    {v:"ginger_beer", label:"Ginger Beer"},
    {v:"birch_beer", label:"Birch Beer / Sarsaparilla"},
    {v:"other", label:"Other Soda"}
  ];
  var CAT_LABEL = {}; CATEGORIES.forEach(function(c){ CAT_LABEL[c.v]=c.label; });

  // Descriptive 1-5 scales, shown only when annotated. Which axes apply
  // depends on category — ginger beer and "other soda" don't track body/creaminess,
  // and "other soda" swaps spice/bite for a general flavorfulness axis.
  var AXES = {
    sweetness:  {label:"Sweetness",           abbr:"Sw", cssVar:"--ax-sweet"},
    spice:      {label:"Spice / Bite",        abbr:"Sp", cssVar:"--ax-spice"},
    carbonation:{label:"Carbonation",         abbr:"Ca", cssVar:"--ax-carb"},
    body:       {label:"Body / Creaminess",   abbr:"Bo", cssVar:"--ax-body"},
    flavor:     {label:"Flavorfulness",       abbr:"Fl", cssVar:"--ax-flavor"}
  };
  var CATEGORY_AXES = {
    root_beer:   ["sweetness","spice","carbonation","body"],
    birch_beer:  ["sweetness","spice","carbonation","body"],
    ginger_beer: ["sweetness","spice","carbonation"],
    other:       ["sweetness","flavor","carbonation"]
  };

  var TIERS = [
    {v:"amaze_balls", label:"Amaze Balls", rank:7, mainVar:"--t-amaze", bgVar:"--t-amaze-bg"},
    {v:"very_good", label:"Very Good", rank:6, mainVar:"--t-verygood", bgVar:"--t-verygood-bg"},
    {v:"good", label:"Good", rank:5, mainVar:"--t-good", bgVar:"--t-good-bg"},
    {v:"medium", label:"Medium", rank:4, mainVar:"--t-medium", bgVar:"--t-medium-bg"},
    {v:"low_medium", label:"Low Medium", rank:3, mainVar:"--t-lowmedium", bgVar:"--t-lowmedium-bg"},
    {v:"ok", label:"Ok", rank:2, mainVar:"--t-ok", bgVar:"--t-ok-bg"},
    {v:"bad", label:"Bad", rank:1, mainVar:"--t-bad", bgVar:"--t-bad-bg"}
  ];
  var TIER_LABEL = {}, TIER_RANK = {};
  TIERS.forEach(function(t){ TIER_LABEL[t.v]=t.label; TIER_RANK[t.v]=t.rank; });

  var UNIQUE_BAND = {v:null, label:"Uniquely Interesting", rank:-1, mainVar:"--accent-2", bgVar:"--accent-2-bg"};

  function bandFor(tierVal, isUnique){
    if(!tierVal) return isUnique ? UNIQUE_BAND : null;
    var t=null;
    TIERS.forEach(function(x){ if(x.v===tierVal) t=x; });
    return t;
  }

  function tierColor(v){
    var t=bandFor(v, false);
    return t ? "var("+t.mainVar+")" : "var(--muted)";
  }

  function byManufacturer(a,b){ return (a.manufacturer||"").localeCompare(b.manufacturer||""); }

  // ---- static data snapshot, exported from the live Soda Cellar tracker ----
  var DATA = [{"id": "e1", "category": "root_beer", "manufacturer": "Fitz's", "name": "Fitz's Root Beer", "notes": "", "status": "tried", "tier": "amaze_balls", "unique": false, "photoFile": "photos/e1.jpg", "description": "A hometown St. Louis root beer since 1947, blending roots, herbs and spices with pure cane sugar for a rich, robust, creamy flavor and silky head."}, {"id": "e2", "category": "root_beer", "manufacturer": "Judge Wapner's", "name": "Judge Wapner's Root Beer", "notes": "", "status": "tried", "tier": "amaze_balls", "unique": false, "photoFile": "photos/e2.jpg", "description": "A caramel-forward root beer with rich brown-sugar/molasses sweetness, a fleeting creaminess, and a slightly bitter finish."}, {"id": "e3", "category": "birch_beer", "manufacturer": "Johnnie Ryan", "name": "Johnnie Ryan Birch Beer", "notes": "", "status": "tried", "tier": "amaze_balls", "unique": false, "photoFile": "photos/e3.jpg", "description": "A classic New York-style birch beer made with fine extracts and 100% pure cane sugar, packaged in vintage glass bottles since 1935."}, {"id": "e4", "category": "root_beer", "manufacturer": "Saranac", "name": "Saranac Root Beer", "notes": "", "status": "tried", "tier": "very_good", "unique": false, "photoFile": "photos/e4.jpg", "description": "A hand-crafted, small-batch brewery root beer with fresh vanilla and licorice notes and a rich, creamy head."}, {"id": "e5", "category": "root_beer", "manufacturer": "Sioux City", "name": "Sioux City Root Beer", "notes": "", "status": "tried", "tier": "good", "unique": false, "photoFile": "photos/e5.jpg", "description": "The classic root beer taste with a smooth, western-style kick — a nostalgic thirst-quencher."}, {"id": "e6", "category": "root_beer", "manufacturer": "Virgil's", "name": "Virgil's Root Beer", "notes": "Very licorice, little too sweet, but basically good", "status": "tried", "tier": "medium", "unique": false, "photoFile": "photos/e6.jpg", "description": "A rich, creamy root beer t       else if(k==="html") e.innerHTML=attrs[k];
      else if(k.indexOf("on")===0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (kids||[]).forEach(function(k){ if(k) e.appendChild(typeof k==="string"?document.createTextNode(k):k); });
    return e;
  }

  function photoUrl(entry){ return entry.photoFile || null; }
  function initial(entry){ return (entry.manufacturer||entry.name||"?").trim().charAt(0).toUpperCase(); }

  function passesFilter(e){
    if(e.status!==state.status) return false;
    if(state.cat!=="all" && e.category!==state.cat) return false;
    if(state.search){
      var s=state.search.toLowerCase();
      var hay=[e.manufacturer,e.name,e.notes].join(" ").toLowerCase();
      if(hay.indexOf(s)===-1) return false;
    }
    return true;
  }

  function visibleEntries(){ return DATA.filter(passesFilter); }

  function renderChips(){
    var wrap=document.getElementById("catChips");
    wrap.innerHTML="";
    wrap.appendChild(el("button",{class:"chip"+(state.cat==="all"?" active":""), onclick:function(){ state.cat="all"; render(); }},["All types"]));
    CATEGORIES.forEach(function(c){
      wrap.appendChild(el("button",{class:"chip"+(state.cat===c.v?" active":""), onclick:function(){ state.cat=c.v; render(); }},[c.label]));
    });
  }

  function openLightbox(url, entry){
    var back=el("div",{class:"lightbox-back", onclick:function(){ back.remove(); }});
    var img=el("img",{src:url, alt:entry.name});
    var cap=el("div",{class:"cap"},[
      el("div",{class:"manu"},[entry.manufacturer||""]),
      el("div",{class:"name"},[entry.name||""])
    ]);
    back.appendChild(el("div",{class:"lightbox"},[img,cap]));
    document.body.appendChild(back);
  }

  function cardFor(entry){
    var url=photoUrl(entry);
    var photo=url
      ? el("div",{class:"photo clickable", onclick:function(){ openLightbox(url, entry); }},[el("img",{src:url,alt:entry.name})])
      : el("div",{class:"photo"},[initial(entry)]);
    var idBlock=el("div",{class:"id-block"},[
      el("div",{class:"manu"},[entry.manufacturer||""]),
      el("div",{class:"name"},[entry.name||""])
    ]);
    var top=el("div",{class:"card-top"},[photo,idBlock]);

    var badges=el("div",{class:"badges"});
    badges.appendChild(el("span",{class:"badge"},[CAT_LABEL[entry.category]||"Other"]));
    if(entry.status==="tried" && entry.tier){
      badges.appendChild(el("span",{class:"badge tier", style:"background:"+tierColor(entry.tier)+";color:var(--accent-ink)"},[TIER_LABEL[entry.tier]]));
    }
    if(entry.status==="inventory"){ badges.appendChild(el("span",{class:"badge inv"},["In inventory"])); }
    if(entry.status==="want_to_try"){ badges.appendChild(el("span",{class:"badge want"},["Want to try"])); }
    if(entry.unique){ badges.appendChild(el("span",{class:"badge unique"},["Uniquely interesting"])); }

    var description = entry.description ? el("div",{class:"description"},[entry.description]) : null;
    var notes = entry.notes ? el("div",{class:"notes"},[entry.notes]) : null;
    var scores = axisRow(entry);

    var band = entry.status==="tried" ? bandFor(entry.tier, entry.unique) : null;
    var cardStyle = band ? "border-left-color:var("+band.mainVar+")" : "";

    return el("div",{class:"card", style:cardStyle},[top,badges,description,notes,scores]);
  }

  // Renders the descriptive score chips for an entry — only the axes that
  // apply to its category AND have actually been annotated. Nothing shows
  // for entries with no scores recorded yet.
  function axisRow(entry){
    if(!entry.scores) return null;
    var axesForCat = CATEGORY_AXES[entry.category] || [];
    var chips = axesForCat.map(function(key){
      var v = entry.scores[key];
      if(!v) return null;
      var ax = AXES[key];
      var dots = "";
      for(var i=1;i<=5;i++){ dots += (i<=v ? "●" : "○"); }
      return el("span",{class:"axis-chip", style:"color:var("+ax.cssVar+")", title:ax.label},[
        el("span",{class:"axis-abbr"},[ax.abbr]),
        el("span",{class:"axis-num mono"},[String(v)]),
        el("span",{class:"axis-dots"},[dots])
      ]);
    }).filter(Boolean);
    if(!chips.length) return null;
    return el("div",{class:"axis-row"}, chips);
  }

  function groupHeading(text,count,catValue){
    return el("div",{class:"group-heading", onclick:function(){ toggleCollapsed(catValue); }},[
      el("span",{class:"chevron"},["▾"]),
      el("h2",{},[text]),
      el("span",{class:"count mono"},["("+count+")"])
    ]);
  }

  function toggleCollapsed(catValue){
    state.collapsed[catValue] = !state.collapsed[catValue];
    render();
  }

  function tierBandEl(band, count){
    return el("div",{class:"tier-band", style:"border-left-color:var("+band.mainVar+");background:var("+band.bgVar+")"},[
      el("span",{class:"tier-dot", style:"background:var("+band.mainVar+")"}),
      el("span",{class:"tier-band-label"},[band.label]),
      el("span",{class:"count mono"},["("+count+")"])
    ]);
  }

  function renderTierGroups(list, container){
    var uniqueNoTier = list.filter(function(e){ return !e.tier && e.unique; });
    var rated = list.filter(function(e){ return !!e.tier; });
    var untiered = list.filter(function(e){ return !e.tier && !e.unique; });

    TIERS.forEach(function(t){
      var atTier = rated.filter(function(e){ return e.tier===t.v; });
      if(!atTier.length) return;
      atTier.sort(byManufacturer);
      container.appendChild(tierBandEl(t, atTier.length));
      atTier.forEach(function(e){ container.appendChild(cardFor(e)); });
    });
    if(untiered.length){
      untiered.sort(byManufacturer);
      untiered.forEach(function(e){ container.appendChild(cardFor(e)); });
    }
    if(uniqueNoTier.length){
      uniqueNoTier.sort(byManufacturer);
      container.appendChild(tierBandEl(UNIQUE_BAND, uniqueNoTier.length));
      uniqueNoTier.forEach(function(e){ container.appendChild(cardFor(e)); });
    }
  }

  function render(){
    renderChips();
    document.querySelectorAll("#statusSeg button").forEach(function(b){ b.classList.toggle("active", b.dataset.v===state.status); });
    document.querySelectorAll("#sortSeg button").forEach(function(b){ b.classList.toggle("active", b.dataset.v===state.sortMode); });
    document.getElementById("sortSeg").style.display = state.status==="tried" ? "inline-flex" : "none";

    var grid=document.getElementById("grid");
    grid.innerHTML="";

    var items=visibleEntries();
    if(items.length===0){
      grid.appendChild(el("div",{class:"empty-state"},["Nothing here yet. Try clearing your filters."]));
      return;
    }

    if(state.status==="inventory" || state.status==="want_to_try"){
      items.slice().sort(byManufacturer).forEach(function(e){ grid.appendChild(cardFor(e)); });
    } else if(state.sortMode==="rating"){
      renderTierGroups(items, grid);
    } else {
      CATEGORIES.forEach(function(c){
        var inCat=items.filter(function(e){ return e.category===c.v; });
        if(!inCat.length) return;
        var collapsed = !!state.collapsed[c.v];
        var frame = el("div",{class:"group-frame"+(collapsed?" collapsed":"")},[]);
        frame.appendChild(groupHeading(c.label, inCat.length, c.v));
        var groupBody = el("div",{class:"group-body"},[]);
        renderTierGroups(inCat, groupBody);
        frame.appendChild(groupBody);
        grid.appendChild(frame);
      });
    }
  }

  // ---------- export (plain browser downloads — no Claude runtime needed) ----------
  function triggerDownload(filename, blobOrString, mime){
    var blob = blobOrString instanceof Blob ? blobOrString : new Blob([blobOrString], {type: mime || "text/plain"});
    var url = URL.createObjectURL(blob);
    var a = el("a", {href:url, download:filename});
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function scoresText(e){
    if(!e.scores) return "";
    var axesForCat = CATEGORY_AXES[e.category] || [];
    return axesForCat.filter(function(k){ return e.scores[k]; })
      .map(function(k){ return AXES[k].label+" "+e.scores[k]; })
      .join(", ");
  }

  function rowsFor(list){
    return list.map(function(e){
      return {
        Manufacturer: e.manufacturer||"",
        Name: e.name||"",
        Type: CAT_LABEL[e.category]||"",
        Status: e.status==="tried"?"Tried":(e.status==="want_to_try"?"Want to try":"Inventory"),
        Rating: e.tier?TIER_LABEL[e.tier]:"",
        "Uniquely Interesting": e.unique?"Yes":"",
        Scores: scoresText(e),
        Description: e.description||"",
        Notes: e.notes||""
      };
    });
  }

  function buildTextExport(){
    var lines=[];
    lines.push("SODA CELLAR");
    lines.push("(exported "+new Date().toISOString().slice(0,10)+")");
    lines.push("");
    var tried = DATA.filter(function(e){ return e.status==="tried"; });
    var inventory = DATA.filter(function(e){ return e.status==="inventory"; });
    var wantToTry = DATA.filter(function(e){ return e.status==="want_to_try"; });
    CATEGORIES.forEach(function(c){
      var inCat = tried.filter(function(e){ return e.category===c.v; });
      if(!inCat.length) return;
      lines.push(c.label.toUpperCase());
      lines.push("");
      TIERS.forEach(function(t){
        var atTier = inCat.filter(function(e){ return e.tier===t.v; });
        if(!atTier.length) return;
        lines.push(t.label);
        atTier.sort(function(a,b){ return (a.manufacturer||"").localeCompare(b.manufacturer||""); });
        atTier.forEach(function(e){
          var line="- "+e.name;
          if(e.unique) line+="  [Uniquely interesting]";
          if(e.notes) line+="  — "+e.notes;
          lines.push(line);
        });
        lines.push("");
      });
    });
    if(inventory.length){
      lines.push("INVENTORY (bought, not yet tried)");
      lines.push("");
      inventory.sort(function(a,b){ return (a.manufacturer||"").localeCompare(b.manufacturer||""); });
      inventory.forEach(function(e){
        var line="- "+e.name;
        if(e.notes) line+="  — "+e.notes;
        lines.push(line);
      });
      lines.push("");
    }
    if(wantToTry.length){
      lines.push("WANT TO TRY");
      lines.push("");
      wantToTry.sort(function(a,b){ return (a.manufacturer||"").localeCompare(b.manufacturer||""); });
      wantToTry.forEach(function(e){
        var line="- "+e.name;
        if(e.notes) line+="  — "+e.notes;
        lines.push(line);
      });
      lines.push("");
    }
    return lines.join("\n");
  }

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function itemLine(e){
    var line = escapeHtml(e.name);
    if(e.unique) line += ' <i>[Uniquely interesting]</i>';
    if(e.notes) line += " &mdash; "+escapeHtml(e.notes);
    return "<li>"+line+"</li>";
  }
  function buildHtmlExport(){
    var tried = DATA.filter(function(e){ return e.status==="tried"; });
    var inventory = DATA.filter(function(e){ return e.status==="inventory"; });
    var wantToTry = DATA.filter(function(e){ return e.status==="want_to_try"; });
    var body = "";
    body += '<h1 style="font-size:34px;">Soda Cellar</h1>';
    body += "<p><i>Exported "+new Date().toISOString().slice(0,10)+"</i></p>";
    body += "<p>&nbsp;</p>";
    var firstSection = true;
    CATEGORIES.forEach(function(c){
      var inCat = tried.filter(function(e){ return e.category===c.v; });
      if(!inCat.length) return;
      if(!firstSection){ body += "<p>&nbsp;</p><p>&nbsp;</p>"; }
      firstSection = false;
      body += '<h2 style="font-size:24px;">'+escapeHtml(c.label)+"</h2>";
      body += "<p>&nbsp;</p>";
      TIERS.forEach(function(t){
        var atTier = inCat.filter(function(e){ return e.tier===t.v; });
        if(!atTier.length) return;
        body += '<h3 style="font-size:17px;">'+escapeHtml(t.label)+"</h3>";
        atTier.sort(function(a,b){ return (a.manufacturer||"").localeCompare(b.manufacturer||""); });
        body += "<ul>";
        atTier.forEach(function(e){ body += itemLine(e); });
        body += "</ul>";
      });
    });
    if(inventory.length){
      if(!firstSection){ body += "<p>&nbsp;</p><p>&nbsp;</p>"; }
      firstSection = false;
      body += '<h2 style="font-size:24px;">Inventory (bought, not yet tried)</h2><ul>';
      inventory.sort(function(a,b){ return (a.manufacturer||"").localeCompare(b.manufacturer||""); });
      inventory.forEach(function(e){ body += itemLine(e); });
      body += "</ul>";
    }
    if(wantToTry.length){
      if(!firstSection){ body += "<p>&nbsp;</p><p>&nbsp;</p>"; }
      body += '<h2 style="font-size:24px;">Want to try</h2><ul>';
      wantToTry.sort(function(a,b){ return (a.manufacturer||"").localeCompare(b.manufacturer||""); });
      wantToTry.forEach(function(e){ body += itemLine(e); });
      body += "</ul>";
    }
    return "<!doctype html><html><head><meta charset='utf-8'><title>Soda Cellar</title></head><body>"+body+"</body></html>";
  }

  function doExportXlsx(list, filename){
    var rows=rowsFor(list);
    var ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=[{wch:18},{wch:28},{wch:14},{wch:10},{wch:12},{wch:12},{wch:40}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Soda Cellar");
    var out=XLSX.write(wb,{bookType:"xlsx", type:"array"});
    triggerDownload(filename, new Blob([out], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  }

  document.getElementById("statusSeg").addEventListener("click", function(ev){
    var b=ev.target.closest("button"); if(!b) return;
    state.status=b.dataset.v; render();
  });
  document.getElementById("sortSeg").addEventListener("click", function(ev){
    var b=ev.target.closest("button"); if(!b) return;
    state.sortMode=b.dataset.v; render();
  });
  document.getElementById("searchBox").addEventListener("input", function(ev){
    state.search=ev.target.value; render();
  });
  document.getElementById("exportTextBtn").addEventListener("click", function(){
    triggerDownload("soda-cellar.txt", buildTextExport(), "text/plain");
  });
  document.getElementById("exportHtmlBtn").addEventListener("click", function(){
    triggerDownload("soda-cellar.html", buildHtmlExport(), "text/html");
  });
  document.getElementById("exportViewBtn").addEventListener("click", function(){
    doExportXlsx(visibleEntries(), "soda-cellar-view.xlsx");
  });

  render();
})();
</script>
</body>
</html>
