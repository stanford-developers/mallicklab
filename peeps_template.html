<style>
/* ── Peeps page styles ──────────────────────────────────────────── */
#peeps-root { color: #585754; font-family: 'Source Sans Pro', sans-serif; font-size: 15.98px; }

.peeps-section-title {
  font-size: 1.3em; font-weight: 700; margin: 0 0 4px;
}
hr.peeps-rule { border: none; border-top: 1px solid #ddd; margin: 8px 0 20px; }

/* ── PI section ─────────────────────────────────────────────────── */
.pi-section { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 32px; }
.pi-img { border: 2px solid black; margin: 5px; flex-shrink: 0; }
.pi-bio p { margin-bottom: 8px; }

/* ── Current members table ──────────────────────────────────────── */
.members-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.members-table td { vertical-align: top; padding: 8px 4px; }
.members-table td:first-child { width: 170px; }
.members-table .member-img { vertical-align: middle; border: 2px solid black; margin: 5px; }
.members-table .member-name { font-weight: 700; }
.members-table .member-role { color: #666; }

/* ── Alumni grid ─────────────────────────────────────────────────── */
.alumni-grid {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 24px;
}
.alumni-card {
  width: 175px; position: relative; overflow: hidden;
  cursor: default; background: #eee;
  flex-shrink: 0;
}
.alumni-card img {
  display: block; width: 175px; height: 220px;
  object-fit: cover; object-position: top;
  transition: opacity 0.2s;
}
.alumni-card:hover img { opacity: 0.25; }
.alumni-desc {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center; padding: 10px;
  opacity: 0; transition: opacity 0.2s;
  background: rgba(0, 174, 239, 0.92);
  color: white;
}
.alumni-card:hover .alumni-desc { opacity: 1; }
.alumni-desc .alumni-name { font-weight: 700; font-size: 0.9em; margin-bottom: 5px; }
.alumni-desc .alumni-pos { font-size: 0.78em; line-height: 1.3; }

/* ── Interns grid ────────────────────────────────────────────────── */
.interns-list {
  columns: 2; column-gap: 24px;
  margin-bottom: 24px;
}
.intern-item {
  break-inside: avoid; padding: 6px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 0.9em;
}
.intern-name { font-weight: 600; }
.intern-detail { color: #888; font-size: 0.9em; }

.peeps-empty { color: #aaa; font-style: italic; padding: 12px 0; }
</style>

<div id="peeps-root">
  <p class="peeps-empty" id="peeps-loading">Loading…</p>
</div>

<script>
fetch('people.json')
  .then(r => { if (!r.ok) throw new Error('Could not load people.json'); return r.json(); })
  .then(data => renderPeeps(data))
  .catch(err => {
    document.getElementById('peeps-loading').textContent = 'Error: ' + err.message;
  });

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderPeeps(data) {
  const root = document.getElementById('peeps-root');
  let html = '';

  // ── PI ──────────────────────────────────────────────────────────
  const pi = data.pi;
  html += `
    <h2 class="peeps-section-title">Me</h2>
    <hr class="peeps-rule">
    <div class="pi-section">
      <img class="pi-img" src="${esc(pi.img)}" alt="${esc(pi.name)}" width="250">
      <div class="pi-bio">
        <p><strong>${esc(pi.name)}</strong></p>
        <p>${esc(pi.bio)}${pi.bioLink ? ` [<a href="${esc(pi.bioLink)}">Bio and Headshot</a>]` : ''}</p>
      </div>
    </div>`;

  // ── Current members ─────────────────────────────────────────────
  html += `<h2 class="peeps-section-title">Current Stanford Peeps</h2><hr class="peeps-rule">`;
  if (data.current && data.current.length) {
    html += `<table class="members-table"><tbody>`;
    for (const m of data.current) {
      html += `
        <tr>
          <td><img class="member-img" src="${esc(m.img)}" alt="${esc(m.name)}" width="150"></td>
          <td>
            <p><span class="member-name">${esc(m.name)}</span>${m.role ? `, <span class="member-role">${esc(m.role)}</span>` : ''}</p>
            ${m.bio ? `<p>${esc(m.bio)}</p>` : ''}
          </td>
        </tr>`;
    }
    html += `</tbody></table>`;
  } else {
    html += `<p class="peeps-empty">No current members listed.</p>`;
  }

  // ── Alumni ───────────────────────────────────────────────────────
  html += `<hr class="peeps-rule"><h2 class="peeps-section-title">Alumn Types and CAMM Folks</h2><hr class="peeps-rule">`;
  if (data.alumni && data.alumni.length) {
    html += `<div class="alumni-grid">`;
    for (const a of data.alumni) {
      html += `
        <div class="alumni-card">
          <img src="${esc(a.img)}" alt="${esc(a.name)}" width="175" height="220">
          <div class="alumni-desc">
            <div class="alumni-name">${esc(a.name)}</div>
            ${a.position ? `<div class="alumni-pos">${a.position}</div>` : ''}
          </div>
        </div>`;
    }
    html += `</div>`;
  } else {
    html += `<p class="peeps-empty">No alumni listed yet.</p>`;
  }

  // ── Interns ──────────────────────────────────────────────────────
  html += `<hr class="peeps-rule"><h2 class="peeps-section-title">Past Interns</h2><hr class="peeps-rule">`;
  if (data.interns && data.interns.length) {
    html += `<div class="interns-list">`;
    for (const i of data.interns) {
      html += `
        <div class="intern-item">
          <span class="intern-name">${esc(i.name)}</span>
          ${i.detail ? `<span class="intern-detail"> — ${esc(i.detail)}</span>` : ''}
        </div>`;
    }
    html += `</div>`;
  } else {
    html += `<p class="peeps-empty">No interns listed yet — add entries to the <code>interns</code> array in people.json.</p>`;
  }

  root.innerHTML = html;
}
</script>
