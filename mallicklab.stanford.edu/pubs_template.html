<style>
/* ── Publications page styles ─────────────────────────────────────── */
#pubs-root { color: #585754; font-family: 'Source Sans Pro', sans-serif; font-size: 15.98px; }

/* Controls bar */
.pubs-controls {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid #eee;
}
.pubs-controls button {
  padding: 5px 13px; border: 1px solid #ddd; border-radius: 3px;
  background: white; cursor: pointer; font-size: 0.85em; font-family: inherit;
  color: #585754; transition: all 0.15s;
}
.pubs-controls button:hover { border-color: #00aeef; color: #00aeef; }
.pubs-controls .expand-all { margin-left: auto; }
#pubSearch {
  padding: 5px 12px; border: 1px solid #ddd; border-radius: 3px;
  font-size: 0.85em; font-family: inherit; width: 200px;
}
#pubSearch:focus { outline: none; border-color: #00aeef; }

/* Selected publications section */
.pubs-featured-section { margin-bottom: 28px; }
.pubs-section-title {
  font-size: 1em; font-weight: 700; color: #0077b3;
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 12px; padding-bottom: 6px;
  border-bottom: 2px solid #00aeef; display: flex; align-items: center; gap: 8px;
}
.pubs-section-title .section-count {
  font-weight: 400; font-size: 0.8em; color: #888; text-transform: none; letter-spacing: 0;
}

/* Year group */
.year-group { margin-bottom: 6px; }
.year-header {
  display: flex; align-items: center; gap: 10px; padding: 8px 0;
  cursor: pointer; user-select: none; border-bottom: 1px solid #eee;
  margin-bottom: 8px;
}
.year-header:hover { color: #00aeef; }
.year-label { font-size: 1em; font-weight: 700; color: #333; }
.year-toggle { font-size: 0.8em; color: #aaa; transition: transform 0.2s; }
.year-header.collapsed .year-toggle { transform: rotate(-90deg); }
.year-count { font-size: 0.78em; color: #aaa; margin-left: auto; }
.year-body { margin-bottom: 16px; }
.year-body.hidden { display: none; }

/* Publication entry */
.pub-entry {
  margin: 0 0 1.25em; list-style: none;
  padding: 0.3125em 0.625em 0.4em;
  border-left: 0.3125em solid transparent;
  line-height: 1.35;
  position: relative;
}
.pub-entry.pub-normal { background: white; }
.pub-entry.pub-highlighted { background-color: #fbf7dc; border-left-color: #ebac00; }
.pub-entry.pub-featured { background-color: #e8f6fd; border-left-color: #00aeef; }
.pub-entry.pub-preprint { background: #f8f8f8; border-left-color: #bbb; }
.pub-entry.pub-inpress { background: #f5fbf5; border-left-color: #66bb6a; }

.pub-title-text {
  display: block; font-weight: 600; font-size: 0.875em; margin-bottom: 2px;
}
.pub-title-text a { color: inherit; text-decoration: none; }
.pub-title-text a:hover { color: #00aeef; text-decoration: underline; }

.pub-authors {
  display: block; font-size: 0.857em; color: #585754; margin-bottom: 2px;
}
.pub-authors.truncated { overflow: hidden; }
.pub-authors .authors-short { display: inline; }
.pub-authors .authors-full { display: none; }
.pub-authors.expanded .authors-short { display: none; }
.pub-authors.expanded .authors-full { display: inline; }
.toggle-authors {
  background: none; border: none; color: #9d9573; font-size: 0.85em;
  cursor: pointer; padding: 0; font-family: inherit;
}
.toggle-authors:hover { color: #00aeef; }

.pub-details { font-size: 0.857em; color: #585754; }
.pub-journal { font-style: italic; }
.pub-badges-inline { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
.pub-badge {
  font-size: 0.75em; padding: 1px 6px; border-radius: 10px; font-weight: 700;
  vertical-align: middle; white-space: nowrap;
}
.pub-badge-featured { background: #e8f6fd; color: #0077b3; border: 1px solid #00aeef; }
.pub-badge-highlighted { background: #fbf7dc; color: #8a6400; border: 1px solid #ebac00; }
.pub-badge-preprint { background: #f0f0f0; color: #555; border: 1px solid #bbb; }
.pub-badge-inpress { background: #f0f9f0; color: #2e7d32; border: 1px solid #66bb6a; }

.pub-links { margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.pub-link {
  font-size: 0.8em; color: #0077b3; text-decoration: none;
  padding: 1px 7px; border: 1px solid #00aeef; border-radius: 3px;
  transition: all 0.15s;
}
.pub-link:hover { background: #00aeef; color: white; }
.pub-link.pdf-link { border-color: #ebac00; color: #8a6400; }
.pub-link.pdf-link:hover { background: #ebac00; color: white; }

.pubs-loading { color: #aaa; font-style: italic; padding: 20px 0; }
.pubs-empty { color: #aaa; padding: 20px 0; }

.featured-also-note {
  font-size: 0.78em; color: #aaa; font-style: italic; margin-top: 2px;
}
</style>

<div id="pubs-root">
  <div class="pubs-controls">
    <input type="text" id="pubSearch" placeholder="Search publications…" oninput="pubsFilter()">
    <button onclick="pubsExpandAll()">Expand all years</button>
    <button onclick="pubsCollapseAll()">Collapse all years</button>
  </div>
  <div id="pubs-featured"></div>
  <div id="pubs-by-year"></div>
  <p class="pubs-loading" id="pubs-loading">Loading publications…</p>
</div>

<script>
(function() {
  const MAX_AUTHORS = 6; // show first N, then "et al." / toggle

  // ── Fetch publications.json + pdfs/index.json in parallel ───────────
  // pdfs/index.json is a simple array of filenames, e.g. ["chambers-2012-proteowizard.pdf"]
  // PDFs should be named {publication-id}.pdf and placed in the pdfs/ folder.
  // If pdfs/index.json is missing or empty, PDF links are omitted gracefully.
  let availablePdfs = new Set(); // populated from pdfs/index.json

  Promise.all([
    fetch('publications.json')
      .then(r => { if (!r.ok) throw new Error('Could not load publications.json'); return r.json(); }),
    fetch('pdfs/index.json')
      .then(r => r.ok ? r.json() : [])
      .catch(() => []) // silently ignore missing manifest
  ])
  .then(([data, pdfList]) => {
    availablePdfs = new Set(pdfList.map(f => f.toLowerCase()));
    window._pubsData = data;
    renderPubs(data);
  })
  .catch(err => {
    document.getElementById('pubs-loading').textContent = 'Error loading publications: ' + err.message;
  });

  // ── Render ────────────────────────────────────────────────────────────
  function renderPubs(data) {
    document.getElementById('pubs-loading').style.display = 'none';

    const featured = data.filter(p => p.highlight === 'featured');
    renderFeatured(featured);
    renderByYear(data);
  }

  function renderFeatured(pubs) {
    const el = document.getElementById('pubs-featured');
    if (!pubs.length) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <div class="pubs-featured-section">
        <div class="pubs-section-title">★ Selected Publications <span class="section-count">${pubs.length} papers</span></div>
        <ul style="padding:0;margin:0;list-style:none">
          ${pubs.map(p => pubHTML(p, true)).join('')}
        </ul>
      </div>`;
  }

  function renderByYear(data) {
    const el = document.getElementById('pubs-by-year');
    const years = [...new Set(data.map(p => p.year).filter(Boolean))].sort((a,b) => b-a);
    const noYear = data.filter(p => !p.year);

    let html = `<div class="pubs-section-title">All Publications <span class="section-count">${data.length} papers</span></div>`;

    for (const yr of years) {
      const yrPubs = data.filter(p => p.year === yr);
      html += yearGroupHTML(yr, yrPubs);
    }
    if (noYear.length) {
      html += yearGroupHTML('No date', noYear);
    }
    el.innerHTML = html;
  }

  function yearGroupHTML(yr, pubs) {
    const id = 'yr-' + yr;
    return `
      <div class="year-group" data-year="${yr}">
        <div class="year-header" onclick="toggleYear('${id}')">
          <span class="year-toggle">▼</span>
          <span class="year-label">${yr}</span>
          <span class="year-count">${pubs.length} paper${pubs.length!==1?'s':''}</span>
        </div>
        <ul class="year-body" id="${id}" style="padding:0;margin:0;list-style:none">
          ${pubs.map(p => pubHTML(p, false)).join('')}
        </ul>
      </div>`;
  }

  function pubHTML(p, isFeaturedSection) {
    const hlClass = p.highlight === 'featured' ? 'pub-featured'
                  : p.highlight === 'highlighted' ? 'pub-highlighted'
                  : p.status === 'preprint' ? 'pub-preprint'
                  : p.status === 'in_press' ? 'pub-inpress'
                  : 'pub-normal';

    // Title with optional DOI link
    const titleInner = p.doi
      ? `<a href="https://doi.org/${p.doi}" target="_blank" rel="noopener">${esc(p.title)}</a>`
      : esc(p.title);

    // Authors with truncation
    const authorsHtml = buildAuthors(p.authors);

    // Details line
    const details = buildDetails(p);

    // Badges (only in year section for featured; always for highlighted/preprint)
    const badges = [];
    if (!isFeaturedSection && p.highlight === 'featured') badges.push(`<span class="pub-badge pub-badge-featured">★ Selected</span>`);
    if (!isFeaturedSection && p.highlight === 'highlighted') badges.push(`<span class="pub-badge pub-badge-highlighted">◆</span>`);
    if (p.status === 'preprint') badges.push(`<span class="pub-badge pub-badge-preprint">Preprint</span>`);
    if (p.status === 'in_press') badges.push(`<span class="pub-badge pub-badge-inpress">In Press</span>`);

    // Links
    const links = [];
    if (p.doi) links.push(`<a class="pub-link" href="https://doi.org/${p.doi}" target="_blank" rel="noopener">DOI</a>`);
    if (p.pmid) links.push(`<a class="pub-link" href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank" rel="noopener">PubMed</a>`);
    if (p.biorxiv_doi && p.status !== 'preprint') links.push(`<a class="pub-link" href="https://doi.org/${p.biorxiv_doi}" target="_blank" rel="noopener">bioRxiv</a>`);
    // PDF: use p.pdf field directly; verify it exists in the pdfs/index.json manifest
    const pdfFilename = p.pdf ? p.pdf.replace(/^pdfs\//, '') : null;
    const pdfHref = pdfFilename && availablePdfs.has(pdfFilename.toLowerCase()) ? p.pdf : null;
    if (pdfHref) links.push(`<a class="pub-link pdf-link" href="${esc(pdfHref)}" target="_blank" rel="noopener">PDF</a>`);

    const alsoNote = isFeaturedSection ? '' : '';

    return `
      <li class="pub-entry ${hlClass}" data-id="${esc(p.id)}" data-title="${esc((p.title||'').toLowerCase())}" data-authors="${esc((p.authors||'').toLowerCase())}" data-journal="${esc((p.journal||'').toLowerCase())}">
        <span class="pub-title-text">${titleInner}${badges.length ? `<span class="pub-badges-inline">${badges.join('')}</span>` : ''}</span>
        ${authorsHtml}
        ${details ? `<span class="pub-details">${details}</span>` : ''}
        ${links.length ? `<div class="pub-links">${links.join('')}</div>` : ''}
      </li>`;
  }

  function buildAuthors(authStr) {
    if (!authStr) return '';
    const parts = authStr.split(',').map(a => a.trim()).filter(Boolean);
    if (parts.length <= MAX_AUTHORS) {
      return `<span class="pub-authors">${esc(parts.join(', '))}</span>`;
    }
    const short = parts.slice(0, MAX_AUTHORS).join(', ') + ' … ';
    const full = parts.join(', ');
    const uid = 'au-' + Math.random().toString(36).slice(2,8);
    return `<span class="pub-authors truncated" id="${uid}">
      <span class="authors-short">${esc(short)}<button class="toggle-authors" onclick="toggleAuthors('${uid}')">+ ${parts.length - MAX_AUTHORS} more</button></span>
      <span class="authors-full">${esc(full)} <button class="toggle-authors" onclick="toggleAuthors('${uid}')">Show fewer</button></span>
    </span>`;
  }

  function buildDetails(p) {
    const parts = [];
    if (p.journal) parts.push(`<span class="pub-journal">${esc(p.journal)}</span>`);
    if (p.year) parts.push(String(p.year));
    if (p.volume) parts.push(p.volume);
    if (p.pages) parts.push(p.pages);
    return parts.join('; ');
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Controls ──────────────────────────────────────────────────────────
  window.toggleYear = function(id) {
    const body = document.getElementById(id);
    const header = body.previousElementSibling;
    if (!body) return;
    body.classList.toggle('hidden');
    header.classList.toggle('collapsed');
  };

  window.pubsExpandAll = function() {
    document.querySelectorAll('.year-body').forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.year-header').forEach(el => el.classList.remove('collapsed'));
  };

  window.pubsCollapseAll = function() {
    document.querySelectorAll('.year-body').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.year-header').forEach(el => el.classList.add('collapsed'));
  };

  window.toggleAuthors = function(id) {
    document.getElementById(id).classList.toggle('expanded');
  };

  window.pubsFilter = function() {
    const q = document.getElementById('pubSearch').value.toLowerCase().trim();
    document.querySelectorAll('.pub-entry').forEach(el => {
      const match = !q ||
        el.dataset.title.includes(q) ||
        el.dataset.authors.includes(q) ||
        el.dataset.journal.includes(q);
      el.style.display = match ? '' : 'none';
    });
    // Show/hide year groups based on visible children
    document.querySelectorAll('.year-group').forEach(grp => {
      const visible = grp.querySelectorAll('.pub-entry:not([style*="display: none"])').length;
      grp.style.display = visible ? '' : 'none';
      if (q) {
        grp.querySelector('.year-body')?.classList.remove('hidden');
        grp.querySelector('.year-header')?.classList.remove('collapsed');
      }
    });
  };
})();
</script>
